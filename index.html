<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Facundo Silva — Full Stack Developer</title>

    <!--
      Google Fonts se carga acá, en el <head>, antes que todo.
      Esto garantiza que la fuente esté disponible desde el primer
      render — sin destello de Arial mientras carga.

      display=swap le dice al browser que muestre el texto con la
      fuente de fallback (Arial) mientras Space Grotesk carga,
      pero que la reemplace apenas esté lista. Sin esto, el texto
      sería invisible durante la carga.

      Pedimos los pesos 400, 500, 700 y 900:
        400 → texto de cuerpo
        500 → subtítulos y labels
        700 → botones y texto destacado
        900 → el nombre en el Hero
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
